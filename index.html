<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="JEP GSS" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="styles.css?v=22" />
  <script src="app.js?v=22" defer></script>
  <title>JEP GSS</title>
</head>
<body>

  <!-- =============================================
       APP SHELL
       One page app — screens toggled via JS.
  ============================================= -->
  <div id="app">

    <!-- NAV BAR (shown during round, hidden on course / round-review screens) -->
    <nav id="nav" class="nav nav--hidden">
      <button class="nav__btn" data-screen="hole-view">Hole</button>
      <button class="nav__btn" data-screen="scorecard">Card</button>
      <button class="nav__btn" data-screen="history">History</button>
      <button class="nav__btn" data-screen="yardage">Yardage</button>
    </nav>

    <!-- ── SCREEN: COURSE DETECTION ─────────────────────────────── -->
    <section id="screen-course" class="screen screen--active">
      <div class="screen__header">
        <img src="JEP GSS Logo.png" alt="JEP GSS Logo" class="app-logo" />
      </div>

      <div class="screen__body">
        <!-- GPS: tap to request permission (Safari requires a user gesture) -->
        <button id="find-location-btn" class="btn btn--find-location">
          &#128205; Find My Location
        </button>

        <!-- GPS status indicator -->
        <div id="gps-status" class="gps-status gps-status--hidden">
          <span id="gps-icon" class="gps-status__icon">&#9679;</span>
          <span id="gps-text" class="gps-status__text"></span>
        </div>

        <!-- Course search -->
        <div class="course-search">
          <div class="course-search__row">
            <input
              id="course-input"
              class="input"
              type="search"
              placeholder="Search by course name…"
              autocomplete="off"
              autocorrect="off"
              spellcheck="false"
            />
            <button id="course-search-btn" class="btn btn--primary btn--search">Search</button>
          </div>
        </div>

        <!-- Nearby / search results list -->
        <div id="course-list" class="course-list"></div>

        <!-- Dev mode panel -->
        <div id="dev-panel" class="dev-panel" hidden>
          <div class="dev-panel__header">
            <span class="dev-panel__label">&#128736; Developer Mode</span>
            <button id="dev-panel-close" class="dev-panel__close" aria-label="Close developer panel">&#10005;</button>
          </div>
          <button id="mock-gps-btn" class="btn btn--mock">
            &#127358; Use Mock Location (Testing)
            <span class="btn--mock__sub">Pebble Beach Golf Links</span>
          </button>
        </div>

        <div class="course-divider"><span>or start manually</span></div>

        <!-- Manual fallback -->
        <div class="course-manual">
          <input
            id="course-name-manual"
            class="input"
            type="text"
            placeholder="Course name (manual)…"
            autocomplete="off"
          />
          <input
            id="course-holes"
            class="input"
            type="number"
            placeholder="Holes (9 or 18)"
            min="9"
            max="18"
            value="18"
          />
          <button id="start-round-btn" class="btn btn--secondary">Start Round Manually</button>
        </div>
      </div>
    </section>

    <!-- ── SCREEN: HOLE VIEW (MAP-FIRST) ─────────────────────────
         Full-screen Leaflet map. Golfer taps a spot to plot shots.
         Thin header for hole navigation. Bottom drawer for stats.
    ─────────────────────────────────────────────────────────────── -->
    <section id="screen-hole-view" class="screen screen--map">

      <!-- Thin top header: back + prev/next hole + hole info -->
      <div class="hole-header">
        <button id="back-btn" class="hole-header__back" aria-label="Back to course">Back</button>
        <button id="prev-hole-btn" class="hole-header__btn" aria-label="Previous hole">&#8592;</button>
        <div class="hole-header__info">
          <span id="hole-header-num" class="hole-header__number">Hole 1</span>
          <span id="hole-header-meta" class="hole-header__meta">Par 4 · 380 yds</span>
        </div>
        <button id="next-hole-btn" class="hole-header__btn" aria-label="Next hole">&#8594;</button>
      </div>

      <!-- SVG hole diagram — fills remaining space, scrolls for long holes -->
      <div id="hole-svg-wrap" class="hole-svg-wrap"></div>

      <!-- ── Shot confirmation card (shown after tap) ────────────
           Appears near centre screen with Yes / Re-tap buttons.
      ──────────────────────────────────────────────────────────── -->
      <div id="shot-confirm" class="shot-confirm" hidden>
        <div class="shot-confirm__title">Shot <span id="confirm-num">1</span> here?</div>
        <div class="shot-confirm__btns">
          <button id="confirm-yes-btn" class="btn btn--primary">Yes</button>
          <button id="confirm-retap-btn" class="btn btn--secondary">Re-tap</button>
        </div>
      </div>

      <!-- ── Shot picker bottom sheet (club → rating) ────────────
           Slides up after "Yes" is tapped.
           Club row appears first; rating grid appears after club tap.
      ──────────────────────────────────────────────────────────── -->
      <div id="shot-picker" class="shot-picker" hidden>
        <div class="shot-picker__handle"></div>
        <div class="shot-picker__title" id="picker-title">Shot <span id="picker-num">1</span> — Select Club</div>

        <!-- Club grid -->
        <div class="shot-picker__clubs" id="picker-clubs">
          <!-- Woods -->
          <button class="club-btn" data-club="D"  title="Driver">D</button>
          <button class="club-btn" data-club="3W" title="3 Wood">3W</button>
          <button class="club-btn" data-club="5W" title="5 Wood">5W</button>
          <div class="club-grid__gap"></div>
          <!-- Irons -->
          <button class="club-btn" data-club="3I" title="3 Iron">3I</button>
          <button class="club-btn" data-club="4I" title="4 Iron">4I</button>
          <button class="club-btn" data-club="5I" title="5 Iron">5I</button>
          <button class="club-btn" data-club="6I" title="6 Iron">6I</button>
          <button class="club-btn" data-club="7I" title="7 Iron">7I</button>
          <button class="club-btn" data-club="8I" title="8 Iron">8I</button>
          <button class="club-btn" data-club="9I" title="9 Iron">9I</button>
          <button class="club-btn" data-club="PW" title="Pitching Wedge">PW</button>
          <!-- Wedges -->
          <button class="club-btn" data-club="SW" title="Sand Wedge">SW</button>
          <button class="club-btn" data-club="LW" title="Lob Wedge">LW</button>
          <!-- Putter full-width -->
          <button class="club-btn club-btn--putter" data-club="P" title="Putter">Putter</button>
        </div>

        <!-- Rating grid (hidden until club selected) -->
        <div class="shot-picker__ratings" id="picker-ratings" hidden>
          <div class="shot-picker__rate-label" id="picker-rate-label">Rate the shot</div>
          <div class="rating-grid">
            <button class="rating-btn rating-btn--great"   data-rating="!" >!</button>
            <button class="rating-btn rating-btn--good2"   data-rating="++">++</button>
            <button class="rating-btn rating-btn--good1"   data-rating="+" >+</button>
            <button class="rating-btn rating-btn--ok"      data-rating="-" >-</button>
            <button class="rating-btn rating-btn--bad1"    data-rating="--">--</button>
            <button class="rating-btn rating-btn--bad2"    data-rating="#" >#</button>
            <button class="rating-btn rating-btn--penalty" data-rating="OB">OB</button>
            <button class="rating-btn rating-btn--penalty" data-rating="L" >L</button>
          </div>
          <div class="rating-legend">
            <span class="rating-legend__item"><b>!</b> +3</span>
            <span class="rating-legend__item"><b>++</b> +2</span>
            <span class="rating-legend__item"><b>+</b> +1</span>
            <span class="rating-legend__item"><b>-</b> 0</span>
            <span class="rating-legend__item"><b>--</b> -1</span>
            <span class="rating-legend__item"><b>#</b> -2</span>
            <span class="rating-legend__item"><b>OB/L</b> -3</span>
          </div>
        </div>

        <div class="shot-picker__actions">
          <button id="picker-cancel-btn" class="btn btn--secondary btn--full">Cancel</button>
        </div>
      </div>

      <!-- ── "In the Hole!" floating button ───────────────────────
           Appears once at least one shot has been logged.
           Confirms hole completion and advances to the next hole.
      ──────────────────────────────────────────────────────────── -->
      <button id="in-hole-btn" class="in-hole-btn" hidden>&#9971; In the Hole!</button>

      <!-- ── Bottom drawer ─────────────────────────────────────────
           Collapsed: thin bar with handle + quick stats.
           Expanded: full shot summary + undo + end round.
           Swipe up/down or tap the bar to toggle.
      ──────────────────────────────────────────────────────────── -->
      <div id="hole-drawer" class="hole-drawer">
        <div class="hole-drawer__handle"></div>
        <div class="hole-drawer__bar" id="drawer-bar">
          <span id="drawer-title">Hole 1 · Par 4</span>
          <span id="drawer-quick-stats">0 strokes · GSS 0</span>
        </div>
        <div class="hole-drawer__detail" id="drawer-detail">
          <div class="drawer-shots" id="drawer-shots">—</div>
          <div class="drawer-stat-row">
            <span>Strokes <b id="drawer-strokes">0</b></span>
            <span>Putts <b id="drawer-putts">0</b></span>
            <span>GSS <b id="drawer-gss">0</b></span>
          </div>
          <div class="drawer-actions">
            <button id="drawer-undo-btn" class="btn btn--secondary" disabled>&#8630; Undo</button>
            <button id="on-green-btn" class="btn btn--on-green" hidden>&#127808; On Green</button>
            <button id="drawer-end-btn" class="btn btn--end-round">&#9873; End Round</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ── SCREEN: SCORECARD ──────────────────────────────────────
         18-hole table. Tapping a hole row navigates to that hole.
    ─────────────────────────────────────────────────────────────── -->
    <section id="screen-scorecard" class="screen">
      <div class="screen__header">
        <h2 class="screen__title">Scorecard</h2>
        <div id="scorecard-course-name" class="scorecard-meta"></div>
      </div>

      <div class="screen__body screen__body--scorecard">
        <div class="scorecard-scroll">
          <table class="scorecard-table" id="scorecard-table">
            <thead>
              <tr>
                <th>Hole</th>
                <th>Par</th>
                <th>Strokes</th>
                <th>Putts</th>
                <th>Rating</th>
              </tr>
            </thead>
            <tbody id="scorecard-body">
              <!-- Rows generated by app.js — tapping a row navigates to that hole -->
            </tbody>
            <tfoot id="scorecard-foot">
              <!-- Totals rows generated by app.js -->
            </tfoot>
          </table>
        </div>

        <div id="round-summary" class="round-summary"></div>

        <div class="scorecard-actions">
          <button id="export-btn" class="btn btn--secondary">Export Round</button>
          <button id="new-round-btn" class="btn btn--primary">New Round</button>
        </div>
      </div>
    </section>

    <!-- ── SCREEN: ROUND HISTORY ──────────────────────────────── -->
    <section id="screen-history" class="screen">
      <div class="screen__header">
        <h2 class="screen__title">Round History</h2>
      </div>
      <div class="screen__body" id="history-body">
        <!-- Cards injected by renderHistory() -->
      </div>
    </section>

    <!-- ── SCREEN: ROUND REVIEW ───────────────────────────────── -->
    <section id="screen-round-review" class="screen">
      <div class="screen__header">
        <div class="round-review-nav">
          <button id="review-back-btn" class="review-back-btn">&#8592; History</button>
          <div id="review-title" class="round-review-title"></div>
        </div>
      </div>
      <div class="screen__body screen__body--scorecard" id="review-body">
        <!-- Injected by renderRoundReview() -->
      </div>
    </section>

    <!-- ── SCREEN: YARDAGE ────────────────────────────────────────
         Lists all holes with par, yardage, and live distance to pin.
         Tapping a hole navigates to that hole's map.
    ─────────────────────────────────────────────────────────────── -->
    <section id="screen-yardage" class="screen">
      <div class="screen__header">
        <h2 class="screen__title">Yardage</h2>
        <div id="yardage-course-name" class="scorecard-meta"></div>
      </div>
      <div class="screen__body" id="yardage-body">
        <!-- Rows injected by renderYardage() -->
      </div>
    </section>

  </div><!-- /#app -->

  <!-- ── API DEBUG OVERLAY ────────────────────────────────── -->
  <div id="api-debug-overlay" class="api-debug-overlay" hidden>
    <div class="api-debug-panel">
      <div class="api-debug-header">
        <span>API Raw Response</span>
        <button id="api-debug-close" class="api-debug-close">&#10005; Close</button>
      </div>
      <pre id="api-debug-pre" class="api-debug-pre"></pre>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast" aria-live="polite"></div>

</body>
</html>
